# quality — the merge gate. Branch rulesets require the `quality / <class>`
# summary jobs at the bottom, never the jobs that do the work, so jobs here
# can be added, split or renamed without touching a ruleset.
#
# Every job runs twice, against two SDKs that answer different questions:
#
#   pinned — the `.fvmrc` version, the toolchain this repo develops on.
#            Catches lints and deprecations the newest analyzer reports.
#   floor  — the oldest Flutter `pubspec.yaml` claims to support. A library
#            floor no build exercises is a claim, not a property; consumers
#            resolve against it, so it is verified like anything else.
#
# Neither version is written here. `floor` is read from the `environment:`
# block and `pinned` from `.fvmrc`, so each value keeps one home and the
# matrix follows a bump automatically.
name: quality
on:
  pull_request:
  merge_group: # required for merge-queue compatibility

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      derived_release_commit: ${{ steps.classify.outputs.derived_release_commit }}
      promotion_pr: ${{ steps.classify.outputs.promotion_pr }}
    steps:
      - id: classify
        uses: point-source/flywheel/classify@59758d1940ebe054ce9fdd4b7a7dc79a0cf235e0 # v2.1.0

  analyze:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      # Report both SDKs. Cancelling the floor build because the pinned one
      # failed (or the reverse) hides half of what the matrix exists to say.
      fail-fast: false
      matrix:
        sdk: [floor, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sdk
        name: Resolve SDK version
        env:
          MATRIX_SDK: ${{ matrix.sdk }}
        run: .github/scripts/resolve-sdk.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

  test-package:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [floor, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sdk
        name: Resolve SDK version
        env:
          MATRIX_SDK: ${{ matrix.sdk }}
        run: .github/scripts/resolve-sdk.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Test (package)
        run: |
          flutter pub get
          flutter test

  test-example:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [floor, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sdk
        name: Resolve SDK version
        env:
          MATRIX_SDK: ${{ matrix.sdk }}
        run: .github/scripts/resolve-sdk.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      # workbench_shell is a path dependency, so this resolves from source
      # and does not need the package's pub get to have run first.
      - name: Test (example)
        working-directory: example
        run: |
          flutter pub get
          flutter test

  governance-lint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: repentsinner/symphonize/.github/workflows/governance-lint.yml@c923c65b044d3ab7866520b5bfba5fca939aac6f # notation--v0.2.16
    with:
      readme-type: library

  actionlint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Digest copied from the release's checksums file, so a replaced
      # release asset fails here rather than running.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sfLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      # actionlint skips run: blocks silently when shellcheck is absent, so
      # its absence has to fail the job rather than pass it.
      - name: Lint workflows
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint"

  # Summary jobs carry the required check names. Each runs whatever its
  # dependencies' outcome, because GitHub counts a skipped required check as
  # passing. A matrixed job reports one result for the whole matrix, so a
  # floor-only failure still lands here.
  governance:
    name: quality / governance
    needs: [classify, governance-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a governance job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  correctness:
    name: quality / correctness
    needs: [classify, analyze, test-package, test-example, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a correctness job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  # The bug-free-happiness supply-chain checks. Its release pin moves through
  # Dependabot like any other Action's, and each release's checks arrive with
  # the bump.
  security-checks:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    uses: repentsinner/bug-free-happiness/.github/workflows/security.yml@8bb4c839a8707cfa7f86be288553635f1e39d3c4 # v0.5.0

  # Not a required check yet: the template requires it once every adopter
  # emits it with real signal.
  security:
    name: quality / security
    needs: [classify, security-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a security job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
